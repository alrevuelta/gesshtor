[package]
name = "gesshtor"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
p12-keystore = "0.4"
pdfplumber = "0.4.1"
ratatui = "0.30"
rpassword = "7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
ureq = { version = "3", default-features = false, features = ["rustls", "cookies", "gzip"] }
x509-parser = "0.18"

# Para repartir: `cargo build --profile dist` (más pequeño y algo más lento de compilar).
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = true
# Lo más pequeño (≈ 4,9 MB). Sin `panic = "abort"`: un PDF raro que haga fallar al lector de PDF tiene que quedar
# como «no se ha podido leer» (`lectura::leer_uno` lo recoge), no cerrar la app.
opt-level = "z"

# Las dependencias (ratatui, pdfplumber) optimizadas también al desarrollar: las pruebas van mucho más rápidas.
[profile.dev.package."*"]
opt-level = 2
